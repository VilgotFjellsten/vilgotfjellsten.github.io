[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-outreach-scraper"
version = "0.1.0"
description = "Niche-partitioned podcast discovery scraper for clipping outreach (v1: health)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "openpyxl>=3.1.2",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "rapidfuzz>=3.6.0",
  "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
podcast-scraper = "podcast_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["podcast_scraper*"]

[tool.setuptools.package-data]
podcast_scraper = ["data/*.json", "fixtures/*.json", "fixtures/*.xml", "fixtures/*.html"]
